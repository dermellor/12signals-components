  </defs>
  <path d="M 56.5 16.6 A 34 34 0 1 0 54.1 83.8" fill="none" stroke="url(#logo-default-arc)" stroke-width="6" stroke-linecap="butt" />
  <path d="M 66.6 35.5 A 22 22 0 1 0 71.9 48.5 L 66.0 51.0 A 16 16 0 1 1 60.6 38.0 Z" fill="url(#logo-default-ring)" />
